<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E6E5C"/></marker></defs><text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Plugin flow</text><text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Plugins are parked in the vault and presented to the hosts; hooks need a personal approve.</text><rect x="30" y="90" width="220" height="120" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="44" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Installed plugin</text><text x="44" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">~/.claude/plugins/cache/</text><text x="44" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">&lt;mkt&gt;/&lt;plugin&gt;/&lt;version&gt;/</text><text x="44" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">skills/ · agents/ · commands/</text><text x="44" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">hooks/ · .mcp.json</text><rect x="330" y="90" width="240" height="120" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="344" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">beadle farm</text><text x="344" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">&lt;vault&gt;/plugins/&lt;mkt&gt;/&lt;name&gt;/</text><text x="344" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">current (pivot)</text><text x="344" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">ledger + quarantine</text><text x="344" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">agents/commands &lt;plugin&gt;--&lt;name&gt;</text><rect x="650" y="90" width="280" height="120" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="664" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Hosts</text><text x="664" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">skills  → link, every host</text><text x="664" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">agents  → link; Codex TOML</text><text x="664" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">commands → OC/Ki/Pi link; Gm TOML</text><text x="664" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">MCP     → the MCP kind</text><rect x="650" y="250" width="280" height="100" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5" stroke-dasharray="6 4"/><text x="664" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Hooks: the approve gate</text><text x="664" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">beadle hooks approve</text><text x="664" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">--plugin &lt;marketplace&gt;/&lt;name&gt;</text><text x="664" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">default: nothing is written</text><line x1="250" y1="150" x2="330" y2="150" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="290.0" y="144.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">scan + park</text><line x1="570" y1="150" x2="650" y2="150" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="610.0" y="144.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">present</text><line x1="790" y1="210" x2="790" y2="250" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="845" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">approve</text><line x1="650" y1="300" x2="570" y2="300" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="610.0" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">canon / bundle</text><text x="330" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">canon wins on a collision;</text><text x="330" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">removed plugins are pruned,</text><text x="330" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">moved ones are quarantined.</text><text x="30" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Claude reads plugins natively; skills farm links still go to every active host.</text></svg>
