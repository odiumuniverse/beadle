<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E6E5C"/></marker></defs><text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">How beadle works</text><text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">One vault canon, real files on every agent, conflicts instead of guesses.</text><rect x="30" y="80" width="250" height="250" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="44" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Agents</text><text x="44" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Claude Code</text><text x="44" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">OpenCode</text><text x="44" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Gemini CLI</text><text x="44" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Cursor</text><text x="44" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Antigravity CLI</text><text x="44" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Codex CLI</text><text x="44" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Pi</text><text x="44" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Kilo Code</text><text x="44" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">DeepSeek Harness</text><rect x="355" y="80" width="250" height="250" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="369" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">beadle engine</text><text x="369" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">reads each agent&#x27;s files</text><text x="369" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">merges item by item</text><text x="369" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">3-way merge against the</text><text x="369" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">last known state</text><text x="369" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start"></text><text x="369" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">writes real files back</text><text x="369" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">never symlinks</text><text x="369" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start"></text><text x="369" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">a conflict waits for you</text><rect x="680" y="80" width="250" height="250" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="694" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Vault canon  ~/.beadle</text><text x="694" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">rules/</text><text x="694" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">mcp/</text><text x="694" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">skills/</text><text x="694" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">subagents/</text><text x="694" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">commands/</text><text x="694" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">permissions/</text><text x="694" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">memory/</text><text x="694" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">projects/</text><text x="694" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">objects/  history</text><line x1="280" y1="150" x2="355" y2="150" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="317.5" y="144.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">pull</text><line x1="355" y1="220" x2="280" y2="220" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="317.5" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">push</text><line x1="605" y1="150" x2="680" y2="150" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="144.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">read</text><line x1="680" y1="220" x2="605" y2="220" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="middle">write</text><text x="30" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Conflicts are recorded with base, vault and agent values; nothing is deleted silently.</text><text x="30" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Every change lands in the object store: beadle history &lt;kind&gt;, beadle restore.</text><text x="30" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">beadle doctor is read-only and names the file and the reason for every finding.</text></svg>
