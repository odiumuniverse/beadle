<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E6E5C"/></marker></defs><text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">Conflict flow</text><text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Both sides changed the same item: beadle keeps both, shows a patch and waits.</text><rect x="30" y="100" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="44" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">edit</text><text x="44" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">vault or agent</text><text x="44" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">changed an item</text><line x1="300" y1="145" x2="330" y2="145" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="100" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="344" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">sync</text><text x="344" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">both sides differ</text><text x="344" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">from the base</text><line x1="600" y1="145" x2="630" y2="145" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="630" y="100" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="644" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">conflict</text><text x="644" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">base + vault + agent</text><text x="644" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">stored, nothing applied</text><line x1="870" y1="190" x2="870" y2="225" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="870" y1="225" x2="165" y2="225" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="165" y1="225" x2="165" y2="250" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="250" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="44" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">conflicts --json</text><text x="44" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">values redacted,</text><text x="44" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">unified patch</text><line x1="300" y1="295" x2="330" y2="295" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="330" y="250" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="344" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">resolve</text><text x="344" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">--from/--stdin with</text><text x="344" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">3 expected hashes</text><line x1="600" y1="295" x2="630" y2="295" stroke="#3E6E5C" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="630" y="250" width="270" height="90" rx="8" fill="none" stroke="#3E6E5C" stroke-width="1.5"/><text x="644" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">sync</text><text x="644" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">the decision reaches</text><text x="644" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">every agent</text><text x="30" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">A changed conflict is refused (stale-conflict) instead of applied: re-read and retry.</text><text x="30" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">permissions and MCP command/url changes need a human (--allow-risky).</text><text x="30" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781" text-anchor="start">Secrets stay references: the canon, conflicts and git history keep {secret:NAME}.</text></svg>
