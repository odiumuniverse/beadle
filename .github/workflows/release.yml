name: release

on:
  push:
    tags: ["v*"]
  # A full dry run of the release pipeline before the first tag exists: build
  # and the three smoke runs happen exactly as they would for a tag, but
  # nothing is published and the tap is not bumped. The version comes from the
  # input, so a release candidate can be exercised under the name it will
  # actually be published under.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.1-rc)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Every artifact is built once, on the mac runner, and shipped to the smoke
  # matrix as a workflow artifact. The release is created only after all three
  # have run on their own OS/arch, so a broken linux-arm64 binary can never be
  # published: the smoke job failing fails the publish job.
  build:
    runs-on: macos-latest
    steps:
      # One definition of the version for the whole file, so a dispatch run and
      # a tag run cannot disagree about what they are building. On a tag it is
      # the tag; on a dispatch it is the input. A dispatch on a branch has
      # GITHUB_REF_NAME set to the BRANCH name, which is why reading it blindly
      # would name the artifacts after a branch.
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: push a v* tag, or pass one to workflow_dispatch" >&2
            exit 1
          fi
          echo "building version ${version} (${EVENT})"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # One-time setup: base64 of the self-signed .p12 in MACOS_SIGN_P12, its password
      # in MACOS_SIGN_P12_PASSWORD, any throwaway keychain password in
      # MACOS_SIGN_KEYCHAIN_PASSWORD. Until then releases are ad-hoc signed.
      - name: Import the signing identity
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGN_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is not set; releases fall back to ad-hoc signing"
            exit 0
          fi
          {
            echo "$SIGN_P12" | base64 --decode > signing.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security set-keychain-settings -lut 3600 signing.keychain
            security import signing.p12 -k signing.keychain -P "$SIGN_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" signing.keychain >/dev/null
            security list-keychains -d user -s signing.keychain $(security list-keychains -d user | tr -d '"')
            rm -f signing.p12
          } || echo "::warning::could not import the signing identity; releases fall back to ad-hoc signing"

      # Each tarball carries a bare `beadle` at its root because the formula
      # does `bin.install "beadle"`, and a `man/` directory beside it because
      # the formula does `man1.install Dir["man/*.1"]`. The linux binaries
      # cross-compile from the mac runner: CGO_ENABLED=0 means no cgo, so no
      # cross toolchain is needed and the result is static. They are NOT signed
      # — a codesign signature is meaningless off darwin and codesign would
      # reject it.

      # The man pages come from the same cobra tree the binary is built from,
      # so a flag cannot exist in one and not the other. Generated here rather
      # than committed, because a checked-in page rots the moment a flag moves.
      # Generated BEFORE the binaries, because every platform tarball carries
      # the pages: brew installs the platform tarball, so a page that lives only
      # in the separate beadle-man archive is a page no brew user ever gets.
      - name: Generate the man pages
        run: |
          version="$VERSION"
          mkdir -p dist/man
          go run -mod=vendor ./cmd/gendocs -out dist/man -version "${version}" -date "$(date -u '+%b %Y')"
          ls -l dist/man | head

      # mandoc, not `man -l` and not groff: the macOS runner ships BSD man,
      # whose -l flag does not exist, and it ships no groff at all. mandoc is
      # in /usr/bin on every macOS runner and renders roff natively.
      #
      # `-W error`, not `-W warning`, and the reason is a known gap rather than
      # a shrug: beadle's cmd/gendocs does not yet rewrite the header cobra
      # renders through go-md2man, so every page carries the same two warnings
      # verger's pages used to — an unparseable .TH date and a tab in filled
      # text. Measured 2026-10-01: 70 pages, 556 lines at warning level, 0 at
      # error level. verger fixed it in cmd/gendocs; beadle has not. Error level
      # is the check that catches a genuinely broken page and it passes. Raising
      # this to warning is one change to beadle/cmd/gendocs away and belongs with
      # it, not here.
      - name: Smoke the man pages
        run: |
          mandoc -T lint -W error dist/man/*.1
          mandoc -T ascii dist/man/beadle.1 > /dev/null
          echo "mandoc: $(find dist/man -name '*.1' | wc -l | tr -d ' ') pages lint clean and beadle.1 renders"

      - name: Pack the man pages
        run: |
          version="$VERSION"
          tar -czf "dist/beadle-man-${version}.tar.gz" -C dist/man .

      - name: Build every artifact
        run: |
          version="$VERSION"
          mkdir -p build/darwin-arm64 build/darwin-amd64 dist
          # A platform tarball without a page is a packaging bug, not a
          # downstream problem, so it fails here rather than in a user's brew.
          test -f dist/man/beadle.1 || { echo "::error::dist/man/beadle.1 is missing; every platform tarball carries it"; exit 1; }
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/darwin-arm64/beadle ./cmd/beadle
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/darwin-amd64/beadle ./cmd/beadle
          lipo -create -output dist/beadle build/darwin-arm64/beadle build/darwin-amd64/beadle
          # Sign after lipo: merging architectures invalidates an earlier signature, and
          # the identifier must be set because codesign would default a Go binary to a.out.
          if codesign --force --sign "odiumuniverse code signing" --timestamp=none --identifier com.odiumuniverse.beadle dist/beadle 2>/dev/null; then
            codesign --verify --strict dist/beadle
            echo "signed dist/beadle"
          else
            echo "::warning::no signing identity; dist/beadle stays ad-hoc signed"
          fi
          tar -czf "dist/beadle-${version}-darwin-universal.tar.gz" -C dist beadle man
          rm -f dist/beadle

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags "-X main.version=${version}" -o dist/beadle ./cmd/beadle
          tar -czf "dist/beadle-${version}-linux-amd64.tar.gz" -C dist beadle man
          rm -f dist/beadle

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags "-X main.version=${version}" -o dist/beadle ./cmd/beadle
          tar -czf "dist/beadle-${version}-linux-arm64.tar.gz" -C dist beadle man
          rm -f dist/beadle

          ls -l dist

      # sha256 of every published artifact, so a user can verify a download
      # without trusting the release page.
      - name: Checksum the artifacts
        run: |
          cd dist
          # shasum, not sha256sum: this step runs on the macOS runner, and a
          # stock macOS ships perl's shasum in /usr/bin and no coreutils
          # sha256sum at all. The publish job on ubuntu keeps using sha256sum -
          # the two agree byte for byte, which is why the formula's digests and
          # the checksums file cannot drift apart.
          shasum -a 256 ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload the darwin artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: dist/beadle-*-darwin-universal.tar.gz
          if-no-files-found: error

      - name: Upload the linux-amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/beadle-*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload the linux-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/beadle-*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload the checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Each tarball is unpacked and RUN on a runner of its own OS and arch — not
  # merely built for it. A cross-compiled binary that cannot execute is the
  # failure this catches, and `fail-fast: false` keeps the other two results so
  # one run reports all three.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: darwin-universal
          - runner: ubuntu-latest
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The smoke job names the same tarballs the build job produced, so it
      # resolves the version the same way rather than re-deriving it from the
      # ref, which on a dispatch would be a branch name.
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Run the packaged binary on this runner
        run: |
          version="$VERSION"
          tarball="dist/beadle-${version}-${{ matrix.asset }}.tar.gz"
          mkdir -p unpack
          tar -xzf "$tarball" -C unpack
          test -x unpack/beadle || { echo "::error::the tarball has no executable beadle at its root"; exit 1; }
          # The page must be IN the platform tarball, not only in the separate
          # beadle-man archive: brew installs the platform tarball, so this is
          # the check that decides whether a brew user actually gets a manpage.
          # Listing the archive first, then the unpacked tree, catches both a
          # tarball that never had it and one that has it at the wrong depth.
          tar -tzf "$tarball" | grep -qx 'man/beadle.1' \
            || { echo "::error::${{ matrix.asset }} tarball has no man/beadle.1 at its expected path"; tar -tzf "$tarball"; exit 1; }
          test -s unpack/man/beadle.1 \
            || { echo "::error::unpacked man/beadle.1 is missing or empty"; exit 1; }

          # beadle reports its version through a --version FLAG, not a
          # `beadle version` subcommand: the subcommand is rejected with
          # "unknown command" (verified against the packaged binary), so the
          # smoke step has to ask for the flag.
          got="$(unpack/beadle --version)"
          echo "beadle version on ${{ matrix.runner }}: ${got}"
          case "$got" in
            *"${version}"*) ;;
            *) echo "::error::packaged binary reports '${got}', expected the tag version ${version}"; exit 1 ;;
          esac
          # Completions must be non-empty for all three shells
          for shell in bash zsh fish; do
            out="$(unpack/beadle completion "$shell")"
            [ -n "$out" ] || { echo "::error::beadle completion $shell is empty"; exit 1; }
          done

  # The publish job is skipped on a dispatch, which is the point of a dispatch
  # — and that is exactly why a broken publish step can survive until the first
  # real tag. This job runs on every dispatch and does the one thing that fails
  # when publish is misconfigured: talking to the GitHub API. Read only, so it
  # can never create, edit or upload anything.
  publish-preflight:
    # Needs nothing: it is cheap, it does not build, and it must be able to
    # report a broken publish even when the build is the thing that is red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the release API the way publish will
        env:
          GH_TOKEN: ${{ github.token }}
          # Same env publish uses, on purpose: a preflight that does not set
          # GH_REPO would pass while publish, which never checks the repo out,
          # fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1
          echo "gh can reach ${GH_REPO} without a checkout; publish will too"


  publish:
    needs: [build, smoke]
    # A dispatch run proves the pipeline without publishing: no GitHub release
    # is created and the tap is not bumped, so a candidate can be exercised as
    # often as needed. Only a real tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: darwin-universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job never checks the repository out, so there is no
          # git remote in $GITHUB_WORKSPACE for gh to infer. Without this, gh
          # falls back to the cwd and fails with "not a git repository" —
          # which is how this shipped untested: the linux-tarball release has
          # never run from a tag, so nothing had exercised this step yet.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber

      # The first tag also creates Formula/beadle.rb: the tap is not seeded with
      # a placeholder sha256 (that would fail `brew audit` and the tap's own CI),
      # so the formula appears only once a real artifact exists to point at.
      #
      # The formula is RENDERED IN FULL from the template below on every run,
      # not patched in place, so the result is a pure function of the tag and
      # the two-OS shape is guaranteed rather than maintained.
      - name: Bump the formula in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="$VERSION"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not set; the homebrew-tap formula cannot be bumped" >&2
            exit 1
          fi
          base="https://github.com/odiumuniverse/beadle/releases/download/${GITHUB_REF_NAME}"
          sha_darwin="$(sha256sum "dist/beadle-${version}-darwin-universal.tar.gz" | cut -d' ' -f1)"
          sha_amd64="$(sha256sum "dist/beadle-${version}-linux-amd64.tar.gz" | cut -d' ' -f1)"
          sha_arm64="$(sha256sum "dist/beadle-${version}-linux-arm64.tar.gz" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/odiumuniverse/homebrew-tap.git" tap
          # Into the clone, and this line is load-bearing: the publish job never
          # checks the repository out, so the workspace is NOT a git repo. The
          # formula was being written to $GITHUB_WORKSPACE/Formula/beadle.rb and
          # `git add` was failing with "not a git repository" - which is exactly
          # the kind of break that survives to the first tag because nothing runs
          # publish until one.
          cd tap
          ruby - "$base" "$version" "$sha_darwin" "$sha_amd64" "$sha_arm64" <<'RB'
          require "fileutils"
          base, version, sha_darwin, sha_amd64, sha_arm64 = ARGV
          template = <<~'FORMULA'
            class Beadle < Formula
              desc "One configuration for every AI coding agent"
              homepage "https://github.com/odiumuniverse/beadle"
              license "MIT"

              on_macos do
                # brew style rejects a bare url/sha256 directly inside
                # on_macos/on_linux: the arch has to be stated, because
                # "darwin-universal" and "linux-amd64" are not the same file.
                # Both mac branches point at the same universal tarball, which
                # is exactly what Homebrew expects a universal artifact to look
                # like: one url, declared for both arches.
                on_intel do
                  url "__DARWIN_URL__"
                  sha256 "__DARWIN_SHA__"
                end

                on_arm do
                  url "__DARWIN_URL__"
                  sha256 "__DARWIN_SHA__"
                end
              end

              on_linux do
                on_intel do
                  url "__AMD64_URL__"
                  sha256 "__AMD64_SHA__"
                end

                on_arm do
                  url "__ARM64_URL__"
                  sha256 "__ARM64_SHA__"
                end
              end

              def install
                bin.install "beadle"
                # The man page ships inside the platform tarball, so a brew
                # install gets it without a second download. Dir[] because
                # gendocs may add subcommand pages later and they should land
                # without another edit here.
                man1.install Dir["man/*.1"]
                # No shells: list. The default is the set the binary actually
                # generates, so adding a shell is a change in one place — the
                # binary — instead of two.
                generate_completions_from_executable(bin/"beadle", "completion")
              end

              test do
                # beadle has no `version` subcommand; the flag is the only
                # surface that prints the version, so `brew test` must use it.
                # No backslash before #{bin}: both heredocs here are quoted
                # (<<'RB' and <<~'FORMULA'), so nothing expands the template on
                # its way to disk and a "\#{bin}" would ship a literal backslash
                # into the formula. In the formula's own double-quoted string
                # that is an escaped '#', so `brew test` would run the command
                # "#{bin}/beadle --version" - a path that does not exist.
                assert_match version.to_s, shell_output("#{bin}/beadle --version")
                # `brew test` is the only place a missing man1.install shows up
                # as a failure rather than as a user typing `man beadle` and
                # getting nothing.
                assert_path_exists man1/"beadle.1"
              end
            end
          FORMULA
          src = template
            .gsub("__DARWIN_URL__", "#{base}/beadle-#{version}-darwin-universal.tar.gz")
            .gsub("__DARWIN_SHA__", sha_darwin)
            .gsub("__ARM64_URL__", "#{base}/beadle-#{version}-linux-arm64.tar.gz")
            .gsub("__ARM64_SHA__", sha_arm64)
            .gsub("__AMD64_URL__", "#{base}/beadle-#{version}-linux-amd64.tar.gz")
            .gsub("__AMD64_SHA__", sha_amd64)
          path = "Formula/beadle.rb"
          FileUtils.mkdir_p(File.dirname(path))
          File.write(path, src)
          RB
          git add Formula/beadle.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "beadle ${version}"
          git push
