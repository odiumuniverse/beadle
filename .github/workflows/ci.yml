name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# The real-home guard is strict on CI, where nothing else runs on the runner and
# anything that moved under the runner's home was this suite.
#
# GitHub sets CI=true in every job on its own — docs.github.com, "Variables
# reference", default environment variables: "CI — Always set to true." The same
# page adds that overwriting CI "is not guaranteed that this will always be
# possible", so the default and the ability to restate it are two different
# promises. Setting it here costs one line and makes the guard's strictness a
# property of this repository rather than of the platform's current mood.
env:
  CI: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -mod=vendor ./...
      - run: go vet -mod=vendor ./...
      # pkg/engine takes ~6-9 minutes with -race; the 20m budget keeps Go's
      # 10m default from turning a loaded runner into a random timeout.
      - run: go test -mod=vendor -race -timeout 20m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  diff3-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: BEADLE_GIT_ORACLE=1 go test -mod=vendor -run TestTextOracle ./pkg/merge/

  real-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: real-config e2e
        run: go test -mod=vendor -count=1 -timeout 20m -run TestRealConfig ./pkg/engine/
      - name: fixture is sanitized
        run: |
          if grep -rIiE "(sk-|ctx7|glpat-|ghp_|xoxb-|AKIA|Bearer[[:space:]]+[A-Za-z0-9]{6,}|BEGIN[A-Z ]*PRIVATE KEY)" pkg/engine/testdata/reale2e; then
            echo "sanitize guard: secret-like value in testdata" >&2
            exit 1
          fi
